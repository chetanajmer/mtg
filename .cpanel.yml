---
# cPanel Git Version Control deployment tasks.
# Runs inside the cloned repository directory on every
# "Deploy HEAD Commit" action.
#
# DEPLOYPATH = the folder where the app should live on the server.
# The subdomain's document root should point to DEPLOYPATH/public
# i.e. /home/morethangiftz/beta.morethangiftz.com/public
deployment:
  tasks:
    - export DEPLOYPATH=/home/morethangiftz/beta.morethangiftz.com
    - /usr/bin/rsync -av --exclude='.git/' --exclude='.cpanel.yml' --exclude='.env' --exclude='.env.backup' --exclude='.gitignore' --exclude='node_modules/' --exclude='public/upload/' --exclude='storage/' --exclude='log_laravel/' $PWD/ $DEPLOYPATH/
